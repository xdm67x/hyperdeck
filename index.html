<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>HyperDeck</title>
        <script>
            // resolve theme before first paint — no flash of the wrong scheme
            ;(function () {
                var t = localStorage.getItem('hyperdeck-theme')
                if (t !== 'dark' && t !== 'light') {
                    t =
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches
                            ? 'dark'
                            : 'light'
                }
                document.documentElement.dataset.theme = t
                document.documentElement.style.colorScheme = t
            })()
        </script>
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23100E0C'/%3E%3Crect x='6' y='6' width='9' height='20' rx='2' fill='%23FF6A2B'/%3E%3Crect x='17' y='6' width='9' height='13' rx='2' fill='%23EDE6DA'/%3E%3C/svg%3E"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
